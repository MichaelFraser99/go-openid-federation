name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump level
        type: choice
        required: true
        default: minor
        options:
          - patch
          - minor
          - major
      expected:
        description: The version you expect this run to tag, such as v0.11.0. The run stops if it computes another
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Tests
        run: go test ./...
      - name: Tests (race detector)
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPECTED: ${{ inputs.expected }}
        run: |
          if ! [[ "$EXPECTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected must be a version such as v0.11.0"
            exit 1
          fi
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          if [ "$next" != "$EXPECTED" ]; then
            echo "::error::a $BUMP bump from $latest is $next, not the expected $EXPECTED"
            exit 1
          fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next"
          git push origin "$next"
          gh release create "$next" \
            --title "$next" \
            --generate-notes \
            --notes-start-tag "${{ steps.version.outputs.previous }}"
